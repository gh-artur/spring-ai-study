spring.application.name=mcpclient

logging.pattern.console=%green(%d{HH:mm:ss.SSS}) %blue(%-5level) %red([%thread]) %yellow(%logger{15}) - %msg%n
logging.level.org.springframework.ai.chat.client.advisor=DEBUG
spring.ai.openai.apiKey=${OPENAI_API_KEY}

spring.ai.mcp.client.stdio.servers-configuration=classpath:mcp-servers.json

spring.ai.mcp.client.streamable-http.connections.artur.url=http://localhost:8090
spring.ai.mcp.client.streamable-http.connections.artur.endpoint=mcp

# Cold start do npx (baixa o server na 1a vez) pode passar dos 20s padrao -> timeout no
# handshake MCP. 60s da folga pro cold start no notebook.
spring.ai.mcp.client.request-timeout=60s
