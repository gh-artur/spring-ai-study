# Ativado apenas quando o profile "rag" esta ligado.
# Religa o docker-compose (sobe o Qdrant) e a criacao do schema no vector store.
# Ligar com: ./mvnw spring-boot:run -Dspring-boot.run.profiles=rag
spring.docker.compose.enabled=true
spring.ai.vectorstore.qdrant.initialize-schema=true

spring.docker.compose.file=spring-ai-playground/compose.yml