spring.application.name=spring-ai-study
logging.pattern.console=%green(%d{HH:mm:ss.SSS}) %blue(%-5level) %red([%thread]) %yellow(%logger{15}) - %msg%n

spring.ai.openai.apiKey=${OPENAI_API_KEY}

logging.level.org.springframework.ai.chat.client.advisor=DEBUG

spring.datasource.url=jdbc:h2:file:./chatmemory;AUTO_SERVER=true
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=username
spring.datasource.password=password
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.ai.chat.memory.repository.jdbc.initialize-schema=


spring.jpa.hibernate.ddl-auto=update

# RAG (Qdrant + docker-compose + ingestao de documentos) fica DESLIGADO por padrao,
# para o boot ser rapido enquanto trabalho em outros temas (ex.: tool calling).
# Para LIGAR o RAG: rode com o profile "rag" ativo, ex.:
#   ./mvnw spring-boot:run -Dspring-boot.run.profiles=rag
# ou defina spring.profiles.active=rag. Veja application-rag.properties.
spring.docker.compose.enabled=false

spring.docker.compose.stop.command=down
spring.ai.vectorstore.qdrant.initialize-schema=false
spring.ai.vectorstore.qdrant.host=localhost
spring.ai.vectorstore.qdrant.port=6334
spring.ai.vectorstore.qdrant.collection-name=teste
