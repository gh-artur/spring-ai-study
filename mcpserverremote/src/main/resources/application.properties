spring.application.name=mcpserverremote
server.port = 8090

logging.pattern.console=%green(%d{HH:mm:ss.SSS}) %blue(%-5level) %red([%thread]) %yellow(%logger{15}) - %msg%n

spring.datasource.url=jdbc:h2:file:./chatmemory;AUTO_SERVER=true
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=username
spring.datasource.password=password
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.ai.mcp.server.name=helpdesk-mcp-server
spring.ai.mcp.server.protocol=streamable

spring.ai.chat.memory.repository.jdbc.initialize-schema=true

spring.jpa.hibernate.ddl-auto=update
